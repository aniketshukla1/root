<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <style>html,body{background:#000}</style>
    <title>root // layout preview</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Dev-only harness: stubs the Tauri IPC bridge with representative data so
      // the UI can be rendered and inspected in a plain browser. Not part of the
      // production build (vite only bundles index.html).
      (function () {
        const now = Date.now();
        const iso = (msAgo) => new Date(now - msAgo).toISOString();

        function walk(count, start, drift, jitter, floor, ceil) {
          const points = [];
          let v = start;
          for (let i = count - 1; i >= 0; i--) {
            v += (Math.random() - 0.5) * jitter + drift;
            v = Math.max(floor, Math.min(ceil, v));
            points.push({ t: iso(i * 15000), v: Math.round(v * 100) / 100 });
          }
          return points;
        }


        // --- section helpers -------------------------------------------------
        const col = (key, label, kind, extra = {}) => ({
          key, label, kind, align: ["metric","duration","gauge"].includes(kind.type) ? "end" : "start",
          primary: false, sortable: true, secondary: false, ...extra,
        });
        const txt = (value) => ({ type: "text", value });
        const num = (value) => ({ type: "number", value });
        const dur = (value) => ({ type: "duration", value });
        const ts  = (value) => ({ type: "timestamp", value });
        const tags = (value) => ({ type: "tags", value });
        const stat = (value) => ({ type: "status", value });
        const gauge = (value, max, warnAbove) => ({ type: "gauge", value, max, warnAbove });
        const NUL = { type: "null" };
        const mkRow = (id, name, health, summary, cells, actions = [], extra = null) =>
          ({ id, name, health, summary, cells, actions, extra });
        const sect = (id, label, columns, rows, priority = 50, emptyText = "Nothing to show.", tracked = false) =>
          ({ id, label, columns, rows, priority, emptyText, tracked });

        // A warehouse connection. The point of previewing it is the traces
        // section: its `id` column is marked traceRef, which is what turns the
        // cell into the waterfall opener with no frontend knowledge of gigapipe.
        const gigapipeSections = [
          sect("signals", "Query APIs", [
            col("signal", "Signal", { type: "text" }, { primary: true }),
            col("api", "Endpoint", { type: "text" }),
            col("state", "State", { type: "status" }),
            col("latency", "Answered in", { type: "metric", unit: "millis" }),
          ], [
            mkRow("signal:logs", "logs", "healthy", "answering in 14 ms", {
              signal: txt("logs"), api: txt("/loki/api/v1/labels"), state: stat("healthy"), latency: num(14),
            }),
            mkRow("signal:metrics", "metrics", "healthy", "answering in 11 ms", {
              signal: txt("metrics"), api: txt("/api/v1/labels"), state: stat("healthy"), latency: num(11),
            }),
            mkRow("signal:traces", "traces", "healthy", "answering in 9 ms", {
              signal: txt("traces"), api: txt("/api/echo"), state: stat("healthy"), latency: num(9),
            }),
          ], 5, "No query APIs probed."),
          sect("traces", "Traces", [
            col("trace", "Trace", { type: "text" }, { primary: true }),
            col("service", "Root service", { type: "text" }),
            col("duration", "Duration", { type: "metric", unit: "millis" }),
            col("started", "Started", { type: "timestamp" }),
            col("id", "Trace id", { type: "code" }, { sortable: false, traceRef: true }),
          ], [
            mkRow("trace:4bf92f3577b34da6a3ce929d0e0e4736", "GET /checkout", "degraded", "3400 ms", {
              trace: txt("GET /checkout"), service: txt("gateway"), duration: num(3400),
              started: ts(iso(240)), id: txt("4bf92f3577b34da6a3ce929d0e0e4736"),
            }),
            mkRow("trace:9c1a7e5b2d8f40c3b6e1a4d7f0c2b593", "POST /pay", "unknown", "180 ms", {
              trace: txt("POST /pay"), service: txt("gateway"), duration: num(180),
              started: ts(iso(320)), id: txt("9c1a7e5b2d8f40c3b6e1a4d7f0c2b593"),
            }),
          ], 8, "No traces matched in the search window."),
          sect("ingest", "Ingest pipelines", [
            col("pipeline", "Pipeline", { type: "text" }, { primary: true }),
            col("rate", "Rows/s", { type: "metric", unit: "per_second" }),
            col("rows", "Rows written", { type: "metric", unit: "count" }),
            col("bytes", "Bytes written", { type: "metric", unit: "bytes" }),
          ], [
            mkRow("ingest:logs", "logs", "healthy", "1840.0 rows/s", {
              pipeline: txt("logs"), rate: num(1840), rows: num(94812331), bytes: num(41234567890),
            }),
            mkRow("ingest:traces", "traces", "healthy", "260.0 rows/s", {
              pipeline: txt("traces"), rate: num(260), rows: num(8123991), bytes: num(6234567890),
            }),
          ], 10, "Nothing has been ingested since this instance started.", true),
        ];

        const dockerSections = [sect("containers", "Containers", [
            col("name", "Container", { type: "text" }, { primary: true }),
            col("state", "State", { type: "text" }),
            col("cpu", "CPU", { type: "gauge", unit: "percent" }),
            col("memory", "Memory", { type: "gauge", unit: "bytes" }),
            col("image", "Image", { type: "text" }, { secondary: true }),
            col("project", "Project", { type: "text" }, { secondary: true }),
          ], [
            mkRow("c1", "checkout-api", "down", "Exited (137) 2 minutes ago", {
              name: txt("checkout-api"), state: txt("Exited (137) 2 minutes ago"),
              cpu: NUL, memory: NUL, image: txt("ghcr.io/acme/checkout:1.9"), project: txt("acme"),
            }, [{ tool: "start_container", label: "Start", args: { container: "checkout-api" }, destructive: false }]),
            mkRow("c2", "worker-3", "degraded", "Up 4 minutes (unhealthy)", {
              name: txt("worker-3"), state: txt("Up 4 minutes (unhealthy)"),
              cpu: gauge(92.4, 100, 85), memory: gauge(1.71e9, 2.0e9),
              image: txt("ghcr.io/acme/worker:2.3"), project: txt("acme"),
            }, [{ tool: "restart_container", label: "Restart", args: { container: "worker-3" }, destructive: false },
                { tool: "stop_container", label: "Stop", args: { container: "worker-3" }, destructive: true }]),
            mkRow("c3", "postgres", "healthy", "Up 6 days (healthy)", {
              name: txt("postgres"), state: txt("Up 6 days (healthy)"),
              cpu: gauge(3.1, 100, 85), memory: gauge(4.2e8, 2.0e9),
              image: txt("postgres:16-alpine"), project: txt("acme"),
            }, [{ tool: "restart_container", label: "Restart", args: { container: "postgres" }, destructive: false }]),
            mkRow("c4", "redis", "healthy", "Up 6 days", {
              name: txt("redis"), state: txt("Up 6 days"),
              cpu: gauge(0.8, 100, 85), memory: gauge(9.1e7, 5.0e8),
              image: txt("redis:7-alpine"), project: txt("acme"),
            }, [{ tool: "restart_container", label: "Restart", args: { container: "redis" }, destructive: false }]),
          ], 10, "This engine has no containers.", true)];

        const buildHistory = (pattern) => pattern.split("").map((ch, i) => ({
          number: 47 - i, result: ch === "F" ? "FAILURE" : ch === "U" ? "UNSTABLE" : "SUCCESS",
          building: false, durationMs: 30000 + Math.random() * 60000,
          finishedAt: iso(i * 3600000),
        }));

        const jenkinsSections = [
          sect("queue", "Build queue", [
            col("task", "Task", { type: "text" }, { primary: true }),
            col("stuck", "State", { type: "text" }),
            col("why", "Waiting for", { type: "text" }),
          ], [
            mkRow("q1", "release", "degraded", "Blocked by upstream lock",
              { task: txt("release"), stuck: txt("stuck"), why: txt("Blocked by upstream lock") }),
            mkRow("q2", "deploy", "unknown", "Waiting for next available executor",
              { task: txt("deploy"), stuck: txt("waiting"), why: txt("Waiting for next available executor") }),
          ], 5),
          sect("jobs", "Jobs", [
            col("job", "Job", { type: "text" }, { primary: true }),
            col("result", "Last result", { type: "text" }),
            col("build", "Build", { type: "metric", unit: "count" }),
            col("duration", "Duration", { type: "duration" }),
            col("last_run", "Finished", { type: "timestamp" }),
            col("recent_failures", "Failures / 20", { type: "metric", unit: "count" }, { secondary: true }),
          ], [
            mkRow("web-build", "web-build", "down", "#7 — last build failed", {
              job: txt("web-build"), result: txt("FAILURE"), build: num(7), duration: dur(12),
              last_run: ts(iso(240000)), recent_failures: num(9),
            }, [{ tool: "trigger_jenkins_build", label: "Build now", args: { job: "web-build" }, destructive: false }],
               { builds: buildHistory("FFSFFSFFFSSFSFFSSFFS"), buildable: true }),
            mkRow("flaky", "flaky", "degraded", "#3 — last build unstable", {
              job: txt("flaky"), result: txt("UNSTABLE"), build: num(3), duration: dur(9),
              last_run: ts(iso(900000)), recent_failures: num(6),
            }, [{ tool: "trigger_jenkins_build", label: "Build now", args: { job: "flaky" }, destructive: false }],
               { builds: buildHistory("SFSSFSSFSSFSSFSSFSS"), buildable: true }),
            mkRow("api-build", "api-build", "healthy", "#42 — last build succeeded", {
              job: txt("api-build"), result: txt("SUCCESS"), build: num(42), duration: dur(45),
              last_run: ts(iso(600000)), recent_failures: num(0),
            }, [{ tool: "trigger_jenkins_build", label: "Build now", args: { job: "api-build" }, destructive: false }],
               { builds: buildHistory("SSSSSSSSSSSSSSSSSSSS"), buildable: true }),
          ], 10),
          sect("agents", "Agents", [
            col("agent", "Agent", { type: "text" }, { primary: true }),
            col("status", "Status", { type: "text" }),
            col("executors", "Executors", { type: "metric", unit: "count" }),
            col("reason", "Offline reason", { type: "text" }),
          ], [
            mkRow("n1", "agent-1", "down", "Disk space is too low",
              { agent: txt("agent-1"), status: txt("offline"), executors: num(2), reason: txt("Disk space is too low") }),
            mkRow("n2", "built-in", "healthy", "online · busy",
              { agent: txt("built-in"), status: txt("busy"), executors: num(2), reason: NUL }),
          ], 20),
        ];

        const esSections = [
          sect("nodes", "Nodes", [
            col("node", "Node", { type: "text" }, { primary: true }),
            col("heap", "JVM heap", { type: "gauge", unit: "percent" }),
            col("cpu", "CPU", { type: "gauge", unit: "percent" }),
            col("disk_used", "Disk used", { type: "gauge", unit: "percent" }),
            col("disk_free", "Disk free", { type: "metric", unit: "bytes" }),
            col("roles", "Roles", { type: "tags" }, { secondary: true, sortable: false }),
          ], [
            mkRow("n1", "es-data-1", "degraded", "heap 93%, cpu 40%, disk 62% used", {
              node: txt("es-data-1"), heap: gauge(93, 100, 85), cpu: gauge(40, 100, 85),
              disk_used: gauge(62, 100, 85), disk_free: num(3.2e11), roles: tags(["data", "master"]),
            }),
            mkRow("n2", "es-data-2", "healthy", "heap 54%, cpu 22%, disk 58% used", {
              node: txt("es-data-2"), heap: gauge(54, 100, 85), cpu: gauge(22, 100, 85),
              disk_used: gauge(58, 100, 85), disk_free: num(3.6e11), roles: tags(["data"]),
            }),
          ], 10, "No node stats were returned.", true),
          sect("indices", "Indices", [
            col("index", "Index", { type: "text" }, { primary: true }),
            col("health", "Health", { type: "status" }),
            col("size", "Size", { type: "metric", unit: "bytes" }),
            col("docs", "Docs", { type: "metric", unit: "count" }),
            col("primaries", "Primaries", { type: "metric", unit: "count" }, { secondary: true }),
            col("replicas", "Replicas", { type: "metric", unit: "count" }, { secondary: true }),
          ], [
            mkRow("i1", "logs-2026.08", "healthy", "412,908,111 docs, 284.1 GB", {
              index: txt("logs-2026.08"), health: stat("healthy"), size: num(3.05e11),
              docs: num(412908111), primaries: num(6), replicas: num(1),
            }),
            mkRow("i2", "metrics-2026.08", "degraded", "88,214,003 docs, 41.2 GB", {
              index: txt("metrics-2026.08"), health: stat("degraded"), size: num(4.42e10),
              docs: num(88214003), primaries: num(3), replicas: num(1),
            }),
          ], 20),
        ];

        const pgSections = [
          sect("active_queries", "Active queries", [
            col("pid", "PID", { type: "text" }, { primary: true }),
            col("duration", "Running for", { type: "duration" }),
            col("state", "State", { type: "text" }),
            col("query", "Statement", { type: "code" }, { sortable: false }),
          ], [
            mkRow("q1", "pid 14832", "down", "running 252s", {
              pid: txt("14832"), duration: dur(252), state: txt("active"),
              query: txt("SELECT o.id, o.total, c.name, c.email FROM orders o JOIN customers c ON c.id = o.customer_id WHERE o.created_at > now() - interval '90 days' AND o.status IN ('pending','processing') ORDER BY o.total DESC"),
            }, [{ tool: "terminate_database_query", label: "Terminate", args: { pid: "14832" }, destructive: true }]),
            mkRow("q2", "pid 9021", "degraded", "running 38s", {
              pid: txt("9021"), duration: dur(38), state: txt("idle in transaction"),
              query: txt("UPDATE inventory SET quantity = quantity - 1 WHERE sku = $1 AND quantity > 0"),
            }, [{ tool: "terminate_database_query", label: "Terminate", args: { pid: "9021" }, destructive: true }]),
          ], 5),
          sect("databases", "Databases", [
            col("database", "Database", { type: "text" }, { primary: true }),
            col("size", "Size", { type: "metric", unit: "bytes" }),
          ], [
            mkRow("d1", "appdb", "healthy", "84.9 GB", { database: txt("appdb"), size: num(9.11e10) }),
            mkRow("d2", "analytics", "healthy", "12.4 GB", { database: txt("analytics"), size: num(1.33e10) }),
          ], 20),
        ];

        const httpSections = [sect("checks", "Check", [
            col("url", "URL", { type: "text" }, { primary: true }),
            col("method", "Method", { type: "text" }),
            col("status", "Status", { type: "metric", unit: "count" }),
            col("latency", "Response time", { type: "metric", unit: "millis" }),
            col("body", "Body check", { type: "text" }),
          ], [
            mkRow("u1", "https://status.acme.dev/health", "degraded", "200 OK in 1840ms", {
              url: txt("https://status.acme.dev/health"), method: txt("GET"),
              status: num(200), latency: num(1840), body: txt("matched"),
            }),
          ], 10)];

        const catalog = [
          { kind: "docker", label: "Docker", monogram: "DK", accent: 0, category: "Containers",
            blurb: "Containers, resource usage, health checks, and logs from a Docker Engine.",
            endpoint: { key: "endpoint", label: "Docker host", kind: "text", required: false, advanced: false },
            fields: [], defaultPollSecs: 5,
            capabilities: { logs: true, actions: [{ tool: "restart_container", label: "Restart a container" }], diagnostics: [] } },
          { kind: "gigapipe", label: "Gigapipe", monogram: "GP", accent: 27, category: "Observability",
            blurb: "Ingest rates per pipeline, query APIs that answer or do not, and \u2014 with a LogQL selector \u2014 the applications shipping into it.",
            endpoint: { key: "endpoint", label: "Server URL", kind: "url", placeholder: "http://gigapipe.internal:3100", required: true, advanced: false },
            fields: [], defaultPollSecs: 30, capabilities: { logs: true, actions: [], diagnostics: [] } },
          { kind: "jenkins", label: "Jenkins", monogram: "JK", accent: 1, category: "CI/CD",
            blurb: "Job results, build queue, agents, and console output from failing builds.",
            endpoint: { key: "endpoint", label: "Controller URL", kind: "url", required: true, advanced: false },
            fields: [], defaultPollSecs: 20, capabilities: { logs: true, actions: [], diagnostics: [] } },
          // Mirrors what registry.rs actually declares, so the generated form
          // can be inspected here.
          { kind: "elasticsearch", label: "Elasticsearch", monogram: "ES", accent: 2, category: "Search & analytics",
            blurb: "Cluster health, node resources, shard and index stats, plus log tailing. Works with OpenSearch.",
            endpoint: { key: "endpoint", label: "Cluster URL", kind: "url", placeholder: "https://es.internal:9200", required: true, advanced: false },
            username: { key: "__username", label: "Username", kind: "text", placeholder: "optional",
                        help: "Leave empty to send the credential below as an API key instead.", required: false, advanced: false },
            credential: { key: "__secret", label: "Password or API key", kind: "password",
                          help: "Basic auth password, or a base64 API key.", required: false, advanced: false },
            fields: [
              { key: "logIndex", label: "Log index pattern", kind: "text", placeholder: "logs-*",
                help: "Leave empty to monitor cluster health without tailing documents.", required: false, advanced: false },
              { key: "timestampField", label: "Timestamp field", kind: "text", placeholder: "@timestamp",
                default: "@timestamp", required: false, advanced: true },
              { key: "maxLogLines", label: "Max log lines per poll", kind: "number", default: 200, min: 1, max: 2000,
                help: "Caps how much this connection can contribute per cycle.", required: false, advanced: true },
              { key: "insecureTls", label: "Skip TLS verification", kind: "boolean",
                help: "For internal endpoints with self-signed certificates.", required: false, advanced: true },
            ],
            defaultPollSecs: 15,
            capabilities: { logs: true, actions: [], diagnostics: ["elasticsearch_search"] } },
          { kind: "postgres", label: "PostgreSQL", monogram: "PG", accent: 3, category: "Databases",
            blurb: "Connection saturation, table sizes, long-running queries, locks, replication lag.",
            endpoint: { key: "endpoint", label: "Connection URL", kind: "url", required: true, advanced: false },
            fields: [], defaultPollSecs: 15, capabilities: { logs: true, actions: [], diagnostics: [] } },
          { kind: "mysql", label: "MySQL", monogram: "MY", accent: 4, category: "Databases",
            blurb: "Thread counts, schema sizes, long-running queries, replication state.",
            endpoint: { key: "endpoint", label: "Connection URL", kind: "url", required: true, advanced: false },
            fields: [], defaultPollSecs: 15, capabilities: { logs: true, actions: [], diagnostics: [] } },
          { kind: "http_endpoint", label: "HTTP endpoint", monogram: "EP", accent: 5, category: "Endpoints",
            blurb: "Uptime, status code, and response time for any URL.",
            endpoint: { key: "endpoint", label: "URL", kind: "url", required: true, advanced: false },
            fields: [], defaultPollSecs: 30, capabilities: { logs: true, actions: [], diagnostics: [] } },
          // A kind this frontend build has never heard of, to exercise the
          // synthesized-descriptor fallback.
          { kind: "kafka_cluster", label: "Kafka", monogram: "KF", accent: 6, category: "Streaming",
            blurb: "Broker health, partition lag, and under-replicated partitions.",
            endpoint: { key: "endpoint", label: "Bootstrap servers", kind: "text", required: true, advanced: false },
            fields: [], defaultPollSecs: 20, capabilities: { logs: true, actions: [], diagnostics: [] } },
        ];

        const snapshots = [
          { profileId: "p1", profileName: "prod-docker", kind: "docker", health: "degraded",
            summary: "Engine 29.6.2 — 18/25 containers running, 2 unhealthy",
            metrics: [
              { key: "containers", label: "Containers", value: 25, unit: "count" },
              { key: "running", label: "Running", value: 18, unit: "count" },
              { key: "unhealthy", label: "Unhealthy", value: 2, unit: "count", warnAbove: 0 },
              { key: "cpu_total", label: "Total CPU", value: 143.2, unit: "percent" },
              { key: "mem_total", label: "Total memory", value: 8123456789, unit: "bytes" },
            ],
            sections: dockerSections,
            checkedAt: iso(4000), latencyMs: 63 },
          { profileId: "p2", profileName: "ci.acme.dev", kind: "jenkins", health: "degraded",
            summary: "3 jobs — 1 failing, 1 unstable, 2 queued",
            metrics: [
              { key: "jobs", label: "Jobs", value: 3, unit: "count" },
              { key: "failing", label: "Failing", value: 1, unit: "count", warnAbove: 0 },
              { key: "unstable", label: "Unstable", value: 1, unit: "count", warnAbove: 0 },
              { key: "queue", label: "Queued", value: 2, unit: "count", warnAbove: 10 },
              { key: "nodes_offline", label: "Offline nodes", value: 1, unit: "count", warnAbove: 0 },
            ],
            sections: jenkinsSections, checkedAt: iso(9000), latencyMs: 412 },
          { profileId: "p7", profileName: "legacy-ci", kind: "jenkins", health: "down",
            summary: "Jenkins is unreachable", error: "Jenkins returned 503 for /api/json",
            metrics: [], sections: [], checkedAt: iso(9000), latencyMs: 20031 },
          { profileId: "p3", profileName: "logs-cluster", kind: "elasticsearch", health: "healthy",
            summary: "Cluster `logs-prod` is green — 3 nodes, 0 unassigned shards",
            metrics: [
              { key: "nodes", label: "Nodes", value: 3, unit: "count" },
              { key: "active_shards", label: "Active shards", value: 142, unit: "count" },
              { key: "unassigned_shards", label: "Unassigned shards", value: 0, unit: "count", warnAbove: 0 },
              { key: "max_heap", label: "Peak node heap", value: 63.5, unit: "percent", warnAbove: 85 },
              { key: "store_total", label: "Total store", value: 429496729600, unit: "bytes" },
            ],
            sections: esSections, checkedAt: iso(2000), latencyMs: 41 },
          { profileId: "p4", profileName: "orders-db", kind: "postgres", health: "healthy",
            summary: "PostgreSQL 16.14 — 22/100 connections, 0 long-running queries",
            metrics: [
              { key: "connections", label: "Connections", value: 22, unit: "count" },
              { key: "connection_pct", label: "Connection use", value: 22, unit: "percent", warnAbove: 80 },
              { key: "db_size", label: "Database size", value: 91234567890, unit: "bytes" },
              { key: "cache_hit_ratio", label: "Cache hit ratio", value: 99.4, unit: "percent" },
              { key: "replication_lag", label: "Replication lag", value: 0.4, unit: "seconds", warnAbove: 30 },
            ],
            sections: pgSections, checkedAt: iso(3000), latencyMs: 12 },
          { profileId: "p9", profileName: "warehouse", kind: "gigapipe", health: "degraded",
            summary: "1 trace over 2000 ms",
            metrics: [
              { key: "ingest_rows_per_sec", label: "Ingest rate", value: 2100, unit: "per_second" },
              { key: "signals_up", label: "Query APIs up", value: 3, unit: "count" },
              { key: "traces_listed", label: "Traces matched", value: 2, unit: "count" },
              { key: "traces_slow", label: "Slow traces", value: 1, unit: "count", warnAbove: 0 },
              { key: "ingest_bytes", label: "Bytes written", value: 47469135780, unit: "bytes" },
            ],
            sections: gigapipeSections, checkedAt: iso(4000), latencyMs: 18 },
          { profileId: "p5", profileName: "status.acme.dev", kind: "http_endpoint", health: "degraded",
            summary: "200 OK in 1840ms — slower than 1000ms",
            metrics: [
              { key: "up", label: "Up", value: 1, unit: "count" },
              { key: "latency", label: "Response time", value: 1840, unit: "millis", warnAbove: 1000 },
              { key: "status", label: "Status code", value: 200, unit: "count" },
            ],
            sections: httpSections, checkedAt: iso(1000), latencyMs: 1840 },
          { profileId: "p8", profileName: "staging-docker", kind: "docker", health: "healthy",
            summary: "Engine 29.6.2 — 6/6 containers running",
            metrics: [
              { key: "containers", label: "Containers", value: 6, unit: "count" },
              { key: "running", label: "Running", value: 6, unit: "count" },
              { key: "unhealthy", label: "Unhealthy", value: 0, unit: "count", warnAbove: 0 },
            ],
            sections: [sect("containers", "Containers", dockerSections[0].columns, [
              mkRow("s1", "web", "healthy", "Up 2 days", {

            if (cmd === "plugin:event|listen") return Promise.resolve(++listenerId);
            if (cmd === "plugin:event|unlisten") return Promise.resolve(null);
            const handler = handlers[cmd];
            if (!handler) {
              console.warn("[preview] unhandled command:", cmd, args);
              return Promise.resolve(null);
            }
            return Promise.resolve(handler(args || {}));
          },
          transformCallback: (cb) => cb,
          // `listen()` returns an unlisten that calls through to this; without
          // it every effect cleanup throws and React stops re-rendering.
          unregisterListener: () => {},
          addPluginListener: () => Promise.resolve({ unregister: () => {} }),
        };
        // The event package keeps listener bookkeeping in a dedicated global
        // in Tauri 2. React StrictMode tears listeners down immediately during
        // its development probe, so the browser preview must mirror it.
        window.__TAURI_EVENT_PLUGIN_INTERNALS__ = {
          unregisterListener: () => {},
        };
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
