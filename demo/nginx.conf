# stub_status is what root's nginx collector reads. It is off by default in
# every distribution, which is itself a thing worth demonstrating: a collector
# that reports "unreachable" on a healthy nginx is usually looking at one
# where nobody enabled this.
server {
    listen 80;
    server_name _;

    location / {
        return 200 "root demo proxy\n";
        add_header Content-Type text/plain;
    }

    location /stub_status {
        stub_status;
        # Open because this is a disposable demo on a private port. A real
        # deployment restricts this to the monitoring host.
        allow all;
    }
}
