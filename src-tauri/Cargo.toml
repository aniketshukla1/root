[package]
name = "inframonitoring"
version = "0.1.0"
description = "root — infrastructure intelligence"
authors = ["you"]
edition = "2021"
# Three binaries live here — the desktop app, root-server and root-mcp — so
# `cargo run`, which is what `tauri dev` calls, has to be told which is the app.
default-run = "inframonitoring"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "inframonitoring_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# The desktop app updates itself. Signature verification is the plugin's,
# using the public key in tauri.conf.json.
tauri-plugin-updater = "2"
# Desktop banners, as a notification channel. Called from Rust only (the
# notify loop), so it needs no capability: nothing in the webview invokes it.
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `io-std` is for the MCP server on stdio; everything else predates it.
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "io-std", "process", "net"] }
anyhow = "1.0.104"
thiserror = "2.0.19"
async-trait = "0.1.91"
futures-util = "0.3.33"
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
# Local deploy ingest. Only the pieces a single POST route needs — no tower
# middleware stack, no multipart, no compression.
# `ws` for the event stream the browser client subscribes to; the desktop app
# does not use it and pays for it only in compile time.
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "ws", "query"] }
# Password hashing. Argon2id is the current answer and the parameters that
# matter are its defaults; this is not a place to be clever.
argon2 = { version = "0.5", features = ["std"] }
# Session tokens are stored as their digest, never as themselves.
sha2 = "0.10"
# PKCE challenge encoding, and the authorize URL.
base64 = "0.22"
urlencoding = "2"
tower-http = { version = "0.6", default-features = false, features = ["fs", "cors"] }
# Constant-time token comparison, so a wrong token cannot be recovered by
# timing the reply.
subtle = "2.6"
bollard = "0.21.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# `sqlite` is here for root's OWN storage, not for a collector: the judgement
# journal. The other backends are clients for databases an operator monitors;
# this one is a local file the app writes.
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "mysql", "sqlite", "chrono", "json"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream", "http2", "charset", "query"] }
# The `v1` feature (the default) is what selects the per-platform credential
# store and exposes the `Entry` API: keychain on macOS, the credential manager
# on Windows, and the D-Bus secret service on Linux.
keyring = { version = "4.1.6", features = ["v1"] }
url = "2.5.8"
# Secret detection in config text. Rust's regex crate has no backtracking, so
# a pattern cannot be made to hang on adversarial input — which matters when
# the input is whatever file an operator points the app at.
regex = "1"
# Matching declared config paths. The crate walks a directory once per pattern
# rather than crawling a tree and filtering, so a glob rooted at a shallow
# directory cannot wander into the rest of the filesystem.
glob = "0.3"
kube = { version = "4.2.0", default-features = false, features = ["client", "config", "rustls-tls"] }
# The version feature picks which API structs are generated. Pinned rather than
# "latest" so a crate bump cannot silently change the wire types underneath us;
# core/v1 and apps/v1 are stable enough that v1_33 talks to older and newer
# servers alike.
k8s-openapi = { version = "0.28.0", default-features = false, features = ["v1_33"] }
# Not used directly for TLS — this is here only to name a crypto provider.
# kube's rustls-tls pulls in aws-lc-rs while sqlx pulls in ring, so rustls sees
# two providers and refuses to guess, panicking on the first TLS handshake.
# `install_crypto_provider()` in lib.rs resolves it once at startup.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
redis = { version = "1.5.0", default-features = false, features = ["tokio-comp"] }
# AWS. The SDK rather than hand-rolled HTTP: S3 and SQS are simple enough to
# call directly, but SigV4 signing is not, and getting request signing subtly
# wrong is the kind of bug that fails closed in testing and open in production.
# `behavior-version-latest` is mandatory — the SDK panics at construction
# without it rather than picking a default that could change underneath us.
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "rustls"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "rustls"] }
aws-sdk-sqs = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "rustls"] }
# `compat-3-3-0` and a bson major are mandatory, not optional: the crate has a
# compile_error! for each. Turning default features off drops them, so they are
# named here rather than pulling in the default OpenSSL-backed TLS stack.
mongodb = { version = "3.8.0", default-features = false, features = [
    "rustls-tls",
    "compat-3-3-0",
    "bson-3",
] }
# librdkafka is built from bundled source (cmake-build) and statically linked,
# so the app ships without a system Kafka library.
#
# `ssl-vendored` compiles OpenSSL in rather than linking the host's. It is the
# expensive feature here, and it is not optional in practice: without it
# librdkafka has no TLS *and* no SCRAM, which between them cover nearly every
# real broker. A PLAINTEXT-only Kafka collector would only work against a
# laptop.  GSSAPI/Kerberos is the one mechanism still unsupported — it needs
# cyrus-sasl on the host, which cannot be vendored.
rdkafka = { version = "0.39", default-features = false, features = [
    "tokio",
    "cmake-build",
    "libz",
    "ssl-vendored",
] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6.5"
# ServiceExt::oneshot, for driving the router in tests without binding a port.
tower = { version = "0.5", features = ["util"] }
