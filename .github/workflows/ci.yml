# Everything that has to be true before a change lands.
#
# The suite is the point of this file. Tests that only run when somebody types
# `cargo test` guard nothing between the moment they were written and the moment
# somebody remembers them.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# A second push to a branch makes the first one's result irrelevant. Not on main:
# the public badge reads a cancelled run as "failing", so main's runs always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # Debug symbols are for a debugger, and nothing here runs one.
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Typecheck and build
        # `npm run build` runs tsc first, so a type error fails here rather
        # than shipping a bundle nobody typechecked. That includes
        # src/contracts.generated.ts: real backend values held against the
        # UI's types, so the two cannot drift apart unnoticed.
        run: npm run build

      - name: Frontend checks
        # The pure logic every screen leans on — chart maths, Grafana import,
        # autocomplete, histogram quantiles, the service map's layout, the
        # normal range and forecast — each with its own assertions.
        run: npm test

      - name: Performance budget
        # What the app costs to load, gzipped, against perf-budget.json.
        # Raising the number is allowed; drifting past it is not.
        run: npm run check:budget

  backend:
    # Both, because the desktop app ships on both and a collector that
    # compiles on one is not a collector that compiles.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    services:
      # The store and the account directory are tested against a real
      # PostgreSQL, because the whole value of that layer is what survives the
      # process and a fake that answers from memory tests the one property
      # that does not matter. TimescaleDB, so the hypertable path is exercised
      # rather than only the fallback.
      postgres:
        image: ${{ matrix.os == 'ubuntu-latest' && 'timescale/timescaledb:latest-pg16' || '' }}
        env:
          POSTGRES_PASSWORD: testpw
          POSTGRES_DB: roottest
        ports:
          - 55433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        # Tauri's shell needs a webview toolkit even to typecheck the lib. The
        # bundled librdkafka includes curl's header whether it uses curl or not.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libcurl4-openssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Clippy
        working-directory: src-tauri
        # Warnings are errors here and nowhere else. Locally a warning is a
        # note to fix something; on a branch it is something that will be
        # ignored forever unless it fails.
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: src-tauri
        # The suites that need a live dependency skip cleanly when one is
        # absent, which is how macOS passes without a database. The Linux job
        # has one, so those suites actually run there.
        run: cargo test --all-targets

      - name: Contracts are current
        # The tests rewrite src/contracts.generated.ts from the backend's own
        # serialisation. If that changed the file, a backend shape changed
        # without the UI's types being checked against it: regenerate with
        # `cargo test --lib contracts` and commit.
        run: git diff --exit-code -- src/contracts.generated.ts

      - name: Build the server binary
        working-directory: src-tauri
        # Without the desktop shell, the way the server image builds it.
        run: cargo build --release --no-default-features --bin root-server

  container:
    # The deployment path, built but not published. A Dockerfile that is never
    # built is a Dockerfile that stopped working some time ago.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
